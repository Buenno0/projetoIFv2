services:
  app:
    image: php:8.2-fpm
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    depends_on:
      - db
    command: bash -c "apt update && apt install -y libpng-dev libonig-dev libxml2-dev zip unzip default-mysql-client && docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd && php-fpm"

  webserver:
    image: nginx:latest
    container_name: laravel-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"   # alterei para 3307 para evitar conflito com MySQL local
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
